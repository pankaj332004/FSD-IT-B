<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            flex-wrap: wrap;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card1, .card2, .card3{
            width: 300px;
            height: 400px;
            border: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            background: white;
            display: flex;
            flex-direction: column;
        }
        .card1:hover, .card2:hover, .card3:hover{
            transform: translateY(-8px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
        }
        .card1 h1, .card2 h1, .card3 h1{
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 24px;
            text-align: center;
        }
        .card1 img, .card2 img, .card3 img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-grow: 1;
        }
        /* Modal Styles */
        .modal{
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-content{
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 12px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .close-btn{
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .close-btn:hover,
        .close-btn:focus{
            color: #000;
        }
        .modal-content h2{
            color: #667eea;
            margin-bottom: 15px;
        }
        .modal-content p{
            color: #333;
            line-height: 1.6;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="card1" onclick="openModal(event)" data-title="Page 1" data-description="This is the first card featuring a beautiful landscape photography. It showcases natural beauty and scenic views that inspire creativity and wanderlust. Click to learn more about this stunning image.">
        <h1>page 1</h1>
        <img src="https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?q=80&w=629&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="card 1 image">
    </div>
    <div class="card2" onclick="openModal(event)" data-title="Page 2" data-description="This is the second card showcasing trendy fashion. It represents modern style and contemporary fashion trends. The featured product demonstrates quality craftsmanship and design innovation.">
        <h1>page 2</h1>
        <img src="https://images.unsplash.com/photo-1618354691373-d851c5c3a990?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8c2hpcnR8ZW58MHx8MHx8fDA%3D" alt="card 2 image">
    </div>
    <div class="card3" onclick="openModal(event)" data-title="Page 3" data-description="This is the third card featuring cutting-edge technology. It highlights the latest developments in computing and innovation. Perfect for tech enthusiasts and professionals looking to stay updated.">
        <h1>page 3</h1>
        <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8bGFwdG9wfGVufDB8fDB8fHww" alt="card 3 image">
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle"></h2>
            <p id="modalDescription"></p>
        </div>
    </div>

    <script>
        function openModal(event) {
            const card = event.currentTarget;
            const title = card.getAttribute('data-title');
            const description = card.getAttribute('data-description');
            
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalDescription').textContent = description;
            document.getElementById('modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // Close modal when clicking outside of modal-content
        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
